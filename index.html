<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto Árbol Binario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f0f0f0;
        }

        .caja {
            background: rgba(255, 255, 255, 0.879);
            padding: 20px;
            max-width: 800px;
            margin: auto;
            border-radius: 8px;
        }

        input, button {
            padding: 8px;
            font-size: 16px;
        }

        #error {
            color: red;
            margin: 10px;
        }

        #resultado {
            color: green;
            font-size: 18px;
            font-weight: bold;
            margin: 15px;
        }

        canvas {
            background: #fafafa;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        #limpiar {
            float: right;
            background: #e74c3c;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="caja">

    <button id="limpiar" onclick="limpiar()">Limpiar</button>

    <h2>Árbol Binario de Búsqueda</h2>

    <p>Ingresa números separados por comas:</p>

    <input
        type="text"
        id="datos"
        placeholder="Ejemplo: 50.5, 30, 70.2"
        oninput="validarLetras()"
    >

    <button onclick="ejecutar()">Construir Árbol</button>

    <div id="error"></div>

    <canvas id="miCanvas" width="750" height="400"></canvas>

    <br><br>

    <button id="btnRecorrido" onclick="animarInorden()" disabled>
        Ejecutar recorrido Inorden
    </button>

    <div id="resultado"></div>

</div>


<script>

    // 1. NODO
    class Nodo {
        constructor(valor) {
            this.valor = valor;
            this.izquierdo = null;
            this.derecho = null;
        }
    }


    // 2. ÁRBOL BINARIO
    class ArbolBinario {

        constructor() {
            this.raiz = null;
        }


        insertar(valor) {

            let nuevo = new Nodo(valor);

            if (this.raiz === null) {
                this.raiz = nuevo;
            } else {
                this.insertarNodo(this.raiz, nuevo);
            }
        }


        insertarNodo(actual, nuevo) {

            if (nuevo.valor < actual.valor) {

                if (actual.izquierdo === null)
                    actual.izquierdo = nuevo;
                else
                    this.insertarNodo(actual.izquierdo, nuevo);

            }

            else if (nuevo.valor > actual.valor) {

                if (actual.derecho === null)
                    actual.derecho = nuevo;
                else
                    this.insertarNodo(actual.derecho, nuevo);
            }
        }


        recorridoInorden(nodo = this.raiz, arreglo = []) {

            if (nodo !== null) {

                this.recorridoInorden(nodo.izquierdo, arreglo);

                arreglo.push(nodo);

                this.recorridoInorden(nodo.derecho, arreglo);
            }

            return arreglo;
        }
    }


    let arbol = null;
    let numeros = [];


    // 3. AVISAR SI ESCRIBE LETRAS
    function validarLetras() {

        let texto = document.getElementById("datos").value;
        let error = document.getElementById("error");

        if (/[a-zA-Z]/.test(texto))
            error.innerText = "Solo puedes ingresar números.";
        else
            error.innerText = "";
    }


    // 4. DIBUJAR ÁRBOL
    function dibujar(nodo, x, y, espacio, ctx, activo = null) {

        if (nodo === null) return;


        if (nodo.izquierdo) {

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - espacio, y + 60);
            ctx.stroke();

            dibujar(
                nodo.izquierdo,
                x - espacio,
                y + 60,
                espacio / 2,
                ctx,
                activo
            );
        }


        if (nodo.derecho) {

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + espacio, y + 60);
            ctx.stroke();

            dibujar(
                nodo.derecho,
                x + espacio,
                y + 60,
                espacio / 2,
                ctx,
                activo
            );
        }


        ctx.beginPath();
        ctx.arc(x, y, 18, 0, 2 * Math.PI);

        ctx.fillStyle =
            nodo === activo ? "#f39c12" : "#3498db";

        ctx.fill();

        ctx.stroke();


        ctx.fillStyle = "white";
        ctx.font = "14px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(nodo.valor, x, y);
    }


    function mostrarArbol(activo = null) {

        let canvas = document.getElementById("miCanvas");
        let ctx = canvas.getContext("2d");

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        dibujar(
            arbol.raiz,
            canvas.width / 2,
            40,
            canvas.width / 4,
            ctx,
            activo
        );
    }


    // 5. CONSTRUIR ÁRBOL CON ANIMACIÓN
    function ejecutar() {

        let texto = document.getElementById("datos").value;
        let error = document.getElementById("error");
        let resultado = document.getElementById("resultado");

        error.innerText = "";
        resultado.innerText = "";


        let datos = texto.split(",");
        numeros = [];


        for (let dato of datos) {

            dato = dato.trim();


            // Permite enteros y decimales
            if (!/^-?\d+(\.\d+)?$/.test(dato)) {

                error.innerText =
                    "Ingresa únicamente números válidos separados por comas.";

                return;
            }


            numeros.push(Number(dato));
        }


        if (numeros.length < 2) {

            error.innerText =
                "Ingresa al menos 2 números.";

            return;
        }


        arbol = new ArbolBinario();

        document.getElementById("btnRecorrido").disabled = true;


        let i = 0;


        function insertar() {

            if (i < numeros.length) {

                arbol.insertar(numeros[i]);

                mostrarArbol();

                i++;

                setTimeout(insertar, 600);

            } else {

                document.getElementById(
                    "btnRecorrido"
                ).disabled = false;
            }
        }


        insertar();
    }


    // 6. RECORRIDO INORDEN ANIMADO
    function animarInorden() {

        let nodos = arbol.recorridoInorden();

        let resultado =
            document.getElementById("resultado");

        resultado.innerText = "";


        let valores = [];

        let i = 0;


        function visitar() {

            if (i < nodos.length) {

                mostrarArbol(nodos[i]);

                valores.push(nodos[i].valor);

                resultado.innerText =
                    "Resultado Inorden: " +
                    valores.join(" → ");

                i++;

                setTimeout(visitar, 700);

            } else {

                mostrarArbol();
            }
        }


        visitar();
    }


    // 7. LIMPIAR TODO
    function limpiar() {

        document.getElementById("datos").value = "";

        document.getElementById("error").innerText = "";

        document.getElementById("resultado").innerText = "";

        document.getElementById("btnRecorrido").disabled = true;


        let canvas =
            document.getElementById("miCanvas");

        canvas.getContext("2d").clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        arbol = null;
        numeros = [];
    }

</script>

</body>
</html>
